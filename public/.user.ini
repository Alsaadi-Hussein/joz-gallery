; Read by PHP-FPM, the handler cPanel normally uses. A host running another handler
; ignores this file, so set the same values in MultiPHP INI Editor as DEPLOY.md says.
; Image conversions run inside the upload request and need the memory.
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 12M
post_max_size = 64M
display_errors = Off
log_errors = On
